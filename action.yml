name: Redline Review
description: Pull request reviews that run in your own runners, with your model and your key.
branding:
  icon: git-pull-request
  color: red

inputs:
  model:
    description: The model to use for the review, in provider/model format.
    required: false
    default: opencode-go/glm-5.3
  max_findings:
    description: The most findings one review can post.
    required: false
    default: "10"
  fail_on:
    description: Fail the run at this merge risk or above. One of high, medium or never.
    required: false
    default: high

runs:
  using: composite
  steps:
    - name: Check event
      id: check
      shell: bash
      env:
        ACTION: ${{ github.event.action }}
        DRAFT: ${{ github.event.pull_request.draft }}
        # Fork PRs are skipped: their files could prompt-inject the model into leaking the user's API key.
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        if [[ "$ACTION" == closed || "$DRAFT" == true || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
          echo "::notice::Redline skips closed, draft and fork pull requests."
          echo "run=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 ]]; then
          echo "::error::Redline runs on Linux x64 runners only, like ubuntu-latest."
          exit 1
        fi
        echo "run=true" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v6
      if: steps.check.outputs.run == 'true'
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false

    - uses: oven-sh/setup-bun@v2
      if: steps.check.outputs.run == 'true'
      with:
        bun-version-file: ${{ github.action_path }}/package.json

    - name: Resolve versions
      id: versions
      if: steps.check.outputs.run == 'true'
      shell: bash
      run: |
        echo "opencode=$(jq -r '.devDependencies["@opencode/plugin"]' "$GITHUB_ACTION_PATH/package.json")" >> "$GITHUB_OUTPUT"
        echo "lock=$(sha256sum "$GITHUB_ACTION_PATH/bun.lock" | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      id: cache
      if: steps.check.outputs.run == 'true'
      with:
        path: |
          ${{ github.action_path }}/node_modules
          ${{ runner.temp }}/redline-cli
        key: redline-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.lock }}-${{ steps.versions.outputs.opencode }}

    - name: Install
      if: steps.check.outputs.run == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.versions.outputs.opencode }}
      run: |
        set -euo pipefail
        (cd "$GITHUB_ACTION_PATH" && bun install --frozen-lockfile --production --ignore-scripts)
        mkdir -p "$RUNNER_TEMP/redline-cli"
        curl --fail --location --silent --show-error --retry 3 \
          "https://registry.npmjs.org/@opencode/cli-linux-x64-baseline/-/cli-linux-x64-baseline-$VERSION.tgz" \
          | tar -xz -C "$RUNNER_TEMP/redline-cli" --strip-components=2 package/bin/opencode

    - name: Collect
      if: steps.check.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        MAX_FINDINGS: ${{ inputs.max_findings || '10' }}
        FAIL_ON: ${{ inputs.fail_on || 'high' }}
      run: |
        echo "$RUNNER_TEMP/redline-cli" >> "$GITHUB_PATH"
        node "$GITHUB_ACTION_PATH/dist/collect.js"
        rm -rf opencode.json opencode.jsonc .opencode
        find . -path ./.git -prune -o \( -name AGENTS.md -o -name CLAUDE.md \) -type f -exec rm -f {} +

    - name: Review
      if: steps.check.outputs.run == 'true'
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        args=(--model "${MODEL:-opencode-go/glm-5.3}" --agent review)
        if [[ -f .github/redline/instructions.md ]]; then
          args+=(--file .github/redline/instructions.md)
        fi
        env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
          OPENCODE_CONFIG="$GITHUB_ACTION_PATH/opencode.json" \
          timeout --signal=KILL 15m opencode run --standalone "${args[@]}" \
          "Review PR #$PR_NUMBER. Start with .github/redline/pr.json and .github/redline/diff.patch. Submit the result with submit_review." \
          < /dev/null

    - name: Publish
      if: ${{ !cancelled() && steps.check.outputs.run == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/dist/publish.js"
